<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    :root { --primary: #5b5fc7; --danger: #d13438; --bg: #f8f9fa; --text: #323130; }
    body { width: 380px; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    .header { background: white; padding: 15px 20px; border-bottom: 1px solid #e1dfdd; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; margin: 0; color: var(--primary); }
    #status { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: #e1dfdd; font-weight: 600; }
    #status.recording { background: #fed9cc; color: var(--danger); }
    .controls { padding: 15px 20px; display: flex; gap: 10px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    #startBtn { background: var(--primary); color: white; }
    #stopBtn { background: var(--danger); color: white; display: none; }
    textarea { width: 100%; height: 120px; margin-bottom: 10px; border: 1px solid #e1dfdd; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 12px; resize: none; }
    .content { padding: 0 20px 15px 20px; }
    #result { background: white; border: 1px solid #e1dfdd; border-radius: 6px; padding: 15px; min-height: 100px; font-size: 13px; line-height: 1.5; }
    #exportBtn { background: transparent; color: var(--primary); border: 1px solid var(--primary); display: none; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ GustavIA</h1>
    <div id="status">Inactivo</div>
  </div>
  <div class="controls">
    <button id="startBtn">▶ Iniciar Captura Invisible</button>
    <button id="stopBtn">⏹ Detener y Resumir</button>
  </div>
  <div class="content">
    <textarea id="transcript" placeholder="Transcripción en vivo (solo visible para ti)..." readonly></textarea>
    <h3 style="font-size:14px; margin:10px 0 5px;">Resumen IA:</h3>
    <div id="result">Esperando datos de la reunión...</div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button id="exportBtn" style="flex:1;">📄 .docx</button>
      <button id="exportMdBtn" style="flex:1;">📝 .md</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
